apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiffe-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spiffe-server
  template:
    metadata:
      labels:
        app: spiffe-server
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: server
          image: ghcr.io/spiffe/spire-agent:1.5.1
          command: ["/opt/spire/bin/spire-agent"]
          args: 
            - "api"
            - "watch"
            - "-socketPath"
            - "/run/spire/sockets/agent.sock"
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
